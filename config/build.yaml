---
include:
  # Trackball (CENTRAL on this branch) - Xiao nRF52840 + PAW3222, USB HID
  - board: xiao_ble//zmk
    shield: trackball_central
    artifact-name: trackball_central

  # Cornix Left (Peripheral) - with LED indicator
  - board: cornix_left
    shield: cornix_indicator
    artifact-name: cornix_left_peripheral

  # Cornix Right (Peripheral) - with LED indicator
  - board: cornix_right
    shield: cornix_indicator
    artifact-name: cornix_right_peripheral

  # Settings reset (for troubleshooting)
  # WARNING: Use the correct reset firmware for each device!
  # - reset_cornix_*: Cornix keyboards only (nRF52840 E73 module, app @ 0x1000)
  # - reset_xiao: Xiao nRF52840 BLE only (trackball module, app @ 0x27000)
  # Flashing the wrong reset firmware can corrupt the bootloader!
  - board: cornix_left
    shield: settings_reset
    artifact-name: reset_cornix_left

  - board: cornix_right
    shield: settings_reset
    artifact-name: reset_cornix_right

  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: reset_xiao
