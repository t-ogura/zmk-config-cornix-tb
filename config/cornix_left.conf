# Cornix Left (PERIPHERAL) Configuration
#
# The left half is a split peripheral on both experiment branches
# (feature/right-as-central and feature/xiao-as-central). See the central
# side's conf for the motivation (trackball latency reduction).

# Keyboard name
CONFIG_ZMK_KEYBOARD_NAME="Cornix TB"

# Override board defconfig: left board normally central + USB, here peripheral.
# (Requires patches/zmk-keyboard-cornix/0001-role-defaults-swappable.patch
# applied to lift the board-side `default y` clauses for ROLE_CENTRAL etc.)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_USB=n
# Battery proxy/fetching are central-only; off on peripheral.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

# Bluetooth configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Split keyboard configuration (peripheral role - no CENTRAL flag)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# TX power: 0 dBm (xiao-as-central power pass). The +8 dBm era was sized
# for cross-desk links to a Cornix central; the Xiao central sits
# centimeters away, so 0 dBm has ample margin and battery life wins.
# TX power is a Kconfig choice and the left board defconfig bakes in
# PLUS_8, so we override by selecting the 0 dBm choice symbol (setting
# PLUS_8=n alone cannot deselect a board-defconfig choice).
CONFIG_BT_CTLR_TX_PWR_0=y

# NOTE: CONFIG_BOARD_ENABLE_DCDC=y was attempted on 2026-05-25 and caused
# 100% boot freeze on this specific Cornix PCB. The E73 module variant
# here does not have the external DC-DC inductors populated. Do not
# re-enable without hardware verification.

# BLE connection stability (prevent sudden disconnection).
# 4s supervision timeout: long enough to survive central-side radio-busy
# windows, short enough to detect a vanished central fast and trigger
# fresh adv via recycled().
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Stack bumps for symmetry with central + trackball; defensive against
# multi-link-induced overflows on the peripheral side.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_MAIN_STACK_SIZE=2048

# Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Battery reporting
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
