# Keyboard name
CONFIG_ZMK_KEYBOARD_NAME="Cornix TB"

# Bluetooth configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
# Increased for multiple PC profiles: 3 PC profiles + right keyboard + trackball = 5
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Split keyboard configuration
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Increase BLE TX power for better connectivity (from original Cornix)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# NOTE: CONFIG_BOARD_ENABLE_DCDC=y was attempted on 2026-05-25 to address
# battery-only boot freezes (LDO mode + TX +8 dBm brown-out hypothesis).
# Result: 100% boot freeze on this specific E73 module variant -- the
# external DC-DC inductors that the E73-2G4M08S1C datasheet describes are
# NOT populated on the user's PCB. Do NOT re-enable DCDC on this board
# without first verifying inductor presence on the schematic / module.

# Improve reconnection reliability (boot / wake-from-sleep)
# Longer split BLE supervision timeout: tolerate radio-busy windows
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=800
# Split BLE conn interval = 10ms (8 * 1.25ms). Default is 7.5ms (=6); going
# all the way back to 7.5ms with 2 peripherals + status adv used to starve
# the scan, but prospector v2.2.1's burst/silent cycle (200ms adv / 1800ms
# silent during partial state) removes that contention. 10ms is a middle
# ground: tighter than the previous 15ms (=12) for lower keypress latency
# and fewer drops, looser than 7.5ms to keep multi-link radio time sane.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=8
# Auto re-subscribe to GATT chars on reconnect (faster path back to working state)
CONFIG_BT_GATT_AUTO_RESUBSCRIBE=y

# ZMK PR #3216 backport: avoid TX buffer starvation during concurrent split GATT
# discovery (root cause of issue #3156 "second peripheral never finishes discovery").
# Upstream PR was merged 2026-02-18; our ZMK snapshot 24487bd9 (2026-01-14) predates it.
CONFIG_BT_L2CAP_TX_BUF_COUNT=5
CONFIG_BT_ATT_TX_COUNT=10
# Allow longer create-connection window (covers directed-adv 1.28s timeout + fallback).
CONFIG_BT_CREATE_CONN_TIMEOUT=10
# More controller RX buffers for multi-link to prevent packet drops under contention.
CONFIG_BT_CTLR_RX_BUFFERS=2
# More host TX buffers; default 3 is tight when 2 peripherals + 1 host all
# burst right after connection (GATT discovery + CCC subscribe + first data).
CONFIG_BT_BUF_ACL_TX_COUNT=6

# Stack-size bumps for boot burst + multi-link safety. The system workqueue
# is shared by ZMK split, prospector adv and rgbled-widget; the burst of work
# that fires when central completes both peripherals' GATT discovery + LED
# updates simultaneously can overflow defaults. Generous values are kept as
# defence-in-depth against intermittent freezes seen earlier.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=3072
# BT_LONG_WQ_STACK_SIZE is internal (no prompt) - cannot be set directly.
# BT_HCI_TX_STACK_SIZE needs its WITH_PROMPT companion enabled to accept a value.
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=2048
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=1024
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=1024
CONFIG_MAIN_STACK_SIZE=2048


# Battery level reporting
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Input (for trackball)
CONFIG_INPUT=y

# Pointing device support (CRITICAL for trackball!)
CONFIG_ZMK_POINTING=y

# Input split for receiving trackball data from peripheral
CONFIG_ZMK_INPUT_SPLIT=y

# Mouse support
CONFIG_ZMK_MOUSE=y

# Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# USB logging disabled in normal use: USB CDC enumeration adds 1-2s to boot.
# Re-enable temporarily when debugging by setting =y.
CONFIG_ZMK_USB_LOGGING=n

# Prospector status advertisement (for layer visualization)
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Cornix TB"
CONFIG_PROSPECTOR_CHANNEL=6
# Cornix TB has 2 split peripherals (right half + trackball). Override
# from default 1 -- until both are connected, prospector runs the
# burst/silent cycle to keep the central's radio free for scan/connect.
# (Burst/silent timings use prospector module defaults: 200ms / 1800ms.)
CONFIG_PROSPECTOR_EXPECTED_PERIPHERAL_COUNT=2

# Specify central side (IMPORTANT: Default is RIGHT, but our central is LEFT!)
# Set to RIGHT to swap battery display order for Prospector
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="LEFT"

# Peripheral index mapping
# Peripheral 0 = Trackball, Peripheral 1 = Right half
CONFIG_ZMK_STATUS_ADV_HALF_PERIPHERAL=1
CONFIG_ZMK_STATUS_ADV_AUX1_PERIPHERAL=0

# Activity-based advertising for power optimization
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=1000
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=3000

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
