# Enable SPI
CONFIG_SPI=y
CONFIG_INPUT=y

# Enable PAW3222 driver
CONFIG_PAW3222=y

# Split keyboard configuration (peripheral role - no CENTRAL flag)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Device name for trackball peripheral (max 16 chars due to CONFIG_BT_DEVICE_NAME_MAX)
CONFIG_ZMK_KEYBOARD_NAME="Cornix TB"

# Pointing device support
CONFIG_ZMK_POINTING=y

# Input split for trackball
CONFIG_ZMK_INPUT_SPLIT=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME_MAX=16

# BLE connection stability (prevent sudden disconnection).
# 4s supervision timeout: long enough to survive central-side radio-busy
# windows, short enough to detect a vanished central (e.g. central rebooted)
# fast and trigger fresh adv via recycled(). 6s caused the user's "central
# reboot leaves trackball / right peripheral stuck advertising-less" symptom.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Stack bumps to address trackball freeze ~2s after BLE connection.
# At that moment trackball_led.c's LED_DISPLAY_DURATION work fires, GATT
# subscriptions complete, and battery proxy events propagate; defaults are
# tight especially for the system workqueue shared by all of these.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_MAIN_STACK_SIZE=2048

# Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=15000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# GPIO for custom LED control
CONFIG_GPIO=y

# USB logging for debugging (only works in standalone mode, not in split peripheral)
# CONFIG_ZMK_USB=y
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y
