# Trackball (Xiao nRF52840) as split CENTRAL — feature/xiao-as-central.
# See trackball_central.overlay for the architecture rationale.
#
# Note on power: the Xiao board devicetree already runs the nRF52840
# regulators in DC-DC mode (inductors are populated on this module,
# unlike the Cornix E73 halves) and its defconfig enables HW stack
# protection. Nothing to configure here -- listed for contrast with the
# Cornix boards where DCDC must stay OFF.

# Keyboard name (BLE advertising / USB descriptor)
CONFIG_ZMK_KEYBOARD_NAME="Cornix TB"
CONFIG_BT_DEVICE_NAME_MAX=16

# Central role + USB HID to the PC
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_USB=y

# Bluetooth configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
# 5 PC profiles + left half + right half = 7 (same formula as the
# right-as-central build: ZMK_BLE_PROFILE_COUNT = MAX_PAIRED - PERIPHERALS).
# Keymap already binds &bt BT_SEL 0..4 on the scroll layer QWERT row.
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# TX power: default 0 dBm. The +8 dBm carried over from the Cornix-central
# builds was sized for cross-desk links; with the trackball as central every
# link (halves at ~30cm, PC within a meter) has huge margin at 0 dBm, and
# the +8 dBm peak current was a battery killer twice over on the small
# trackball cell: higher average draw AND deeper voltage sag on TX bursts,
# which cut the link (and the session) while plenty of capacity remained.
# (Deliberately NOT setting CONFIG_BT_CTLR_TX_PWR_PLUS_8.)

# Split link tuning. PREF_INT=12 (15ms): the split links now carry only
# keystrokes and battery updates -- pointer events go straight from the
# local PAW3222 to the endpoint and never cross a split link -- so the
# previous 10ms setting bought nothing perceptible while costing 50% more
# connection events on two links. ~+2.5ms average key latency is far below
# perception; radio time saved on every battery in the system.
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=800
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12
CONFIG_BT_GATT_AUTO_RESUBSCRIBE=y

# Concurrent split GATT discovery headroom (ZMK PR #3216 backport values)
CONFIG_BT_L2CAP_TX_BUF_COUNT=5
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_CREATE_CONN_TIMEOUT=10
CONFIG_BT_CTLR_RX_BUFFERS=2
CONFIG_BT_BUF_ACL_TX_COUNT=6

# Stack bumps: system workqueue is shared by ZMK split, prospector adv,
# PAW3222 input processing and the trackball LED code. Same defensive
# sizing as the Cornix central builds.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=2048
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=1024
CONFIG_MAIN_STACK_SIZE=2048

# Input thread: with the PAW3222 local to the central, every pointer event
# runs on Zephyr's input thread (CONFIG_INPUT_MODE_THREAD): input listener
# -> input processors (zip_temp_layer raises a layer-state event
# synchronously, which dispatches prospector / LED listeners in-thread,
# including prospector's payload rebuild and float-formatting logs)
# -> zmk_endpoint_send_mouse_report. The Zephyr default of 1024 is sized
# for a plain input->HID hop and overflowed here; with the Xiao's MPU
# stack guard that surfaced as a fatal fault ("device powers off") on the
# first pointer move after boot / profile switch. On the Cornix centrals
# the same path never existed (pointer arrived via split on the 4K
# system workqueue).
CONFIG_INPUT_THREAD_STACK_SIZE=2048
# HOG work queue that performs the actual bt_gatt_notify for HID reports
# (ZMK default 768). Headroom for the notify path on a freshly switched
# profile where security/CCC state is still settling.
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=1536

# Peripheral battery levels (both Cornix halves) fetched + proxied
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Trackball sensor: local SPI PAW3222 feeding HID directly.
# (No ZMK_INPUT_SPLIT here -- that was only needed when the sensor lived
# on a peripheral and its events crossed the split link.)
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PAW3222=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# Status LED: rgbled-widget in GPIO mode on the Xiao's built-in RGB LED
# (aliases in the overlay). Same widget as the Cornix halves' indicator,
# so battery-on-boot and connectivity blinks (including BLE profile
# switches via zmk_ble_active_profile_changed) behave identically across
# all devices. Replaces the custom trackball_led.c used on the
# peripheral trackball shield.
CONFIG_GPIO=y
CONFIG_LED=y
CONFIG_RGBLED_WIDGET=y

# Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
# 30min, aligned with the Cornix halves. When the central outlived the
# halves' sleep by 30min it spent that whole window scanning for them.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# USB logging off in normal use (USB CDC enumeration slows boot 1-2s);
# flip to =y temporarily when debugging.
CONFIG_ZMK_USB_LOGGING=n

# Prospector status advertisement
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Cornix TB"
CONFIG_PROSPECTOR_CHANNEL=6
# Two split peripherals (left half + right half); until both connect,
# prospector v2.2.1 runs the burst/silent cycle to keep the radio free.
CONFIG_PROSPECTOR_EXPECTED_PERIPHERAL_COUNT=2

# Battery display-slot mapping: CENTRAL_SIDE="AUX" (prospector v2.2.2)
# is made for exactly this build -- the central is neither keyboard half.
# Both halves map to the Left/Right display slots by peripheral index and
# the central's own (trackball) battery goes to the Aux1 slot. Peripheral
# indices follow bond order (halves may land on 0/1 in either order after
# a settings reset) -- swap LEFT/RIGHT_PERIPHERAL below if the display
# comes up crossed.
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="AUX"
CONFIG_ZMK_STATUS_ADV_LEFT_PERIPHERAL=0
CONFIG_ZMK_STATUS_ADV_RIGHT_PERIPHERAL=1

# Activity-based advertising for power optimization
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=1000
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=3000

# Battery reporting (central = trackball battery via vbatt divider)
CONFIG_ZMK_BATTERY_REPORTING=y
