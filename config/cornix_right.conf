# Cornix Right (Peripheral) Configuration

# Bluetooth configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Split keyboard configuration (peripheral role - no CENTRAL flag)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Disable USB on peripheral (only BLE)
CONFIG_ZMK_USB=n

# Match central TX power. Without this, right->left direction runs at 0 dBm
# while left->right runs at +8 dBm; the asymmetric link bottlenecks on the
# weaker direction, causing key-press drops and latency spikes under marginal
# RF conditions (hand over half, body in line of sight, 2.4 GHz Wi-Fi nearby).
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# NOTE: CONFIG_BOARD_ENABLE_DCDC=y was attempted on 2026-05-25 and caused
# 100% boot freeze on this specific Cornix PCB. The E73 module variant
# here does not have the external DC-DC inductors populated. Do not
# re-enable without hardware verification.

# BLE connection stability (prevent sudden disconnection)
# 4s supervision timeout: see trackball_paw3222.conf for rationale.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Stack bumps for symmetry with central + trackball; defensive against
# multi-link-induced overflows on the peripheral side.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_MAIN_STACK_SIZE=2048

# Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Battery reporting
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
