# Cornix Right (PERIPHERAL on feature/xiao-as-central) Configuration
#
# On this branch the trackball Xiao is the central; BOTH Cornix halves are
# split peripherals. This file mirrors cornix_left.conf.
# (Requires patches/zmk-keyboard-cornix/0001-role-defaults-swappable.patch
# so neither board defconfig hard-forces a central role.)

# Keyboard name
CONFIG_ZMK_KEYBOARD_NAME="Cornix TB"

# Peripheral role, no USB
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_USB=n
# Battery proxy/fetching are central-only; off on peripheral.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

# Bluetooth configuration
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Split keyboard configuration (peripheral role - no CENTRAL flag)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Match central TX power. Without this, right->central direction runs at
# 0 dBm while central->right runs at +8 dBm; the asymmetric link
# bottlenecks on the weaker direction, causing key-press drops and latency
# spikes under marginal RF conditions.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# NOTE: CONFIG_BOARD_ENABLE_DCDC=y was attempted on 2026-05-25 and caused
# 100% boot freeze on this specific Cornix PCB. The E73 module variant
# here does not have the external DC-DC inductors populated. Do not
# re-enable without hardware verification.

# BLE connection stability (prevent sudden disconnection).
# 4s supervision timeout: long enough to survive central-side radio-busy
# windows, short enough to detect a vanished central fast and trigger
# fresh adv via recycled().
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Stack bumps for symmetry with central + trackball; defensive against
# multi-link-induced overflows on the peripheral side.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_MAIN_STACK_SIZE=2048

# Power management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Battery reporting
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
