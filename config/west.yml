manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: hitsmaxft
      url-base: https://github.com/hitsmaxft
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: urob
      url-base: https://github.com/urob
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: prospector
      url-base: https://github.com/t-ogura
    - name: t-ogura
      url-base: https://github.com/t-ogura
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-keyboard-cornix
      remote: hitsmaxft
      revision: main
    - name: zmk-driver-paw3222
      remote: sekigon-gonnoc
      revision: main
    - name: zmk-helpers
      remote: urob
      revision: main
    # Cornix-specific Zephyr 4.x fork (forked from hitsmaxft/zmk-rgbled-widget)
    - name: zmk-rgbled-widget
      remote: t-ogura
      revision: cornix-zephyr4
    - name: prospector-zmk-module
      remote: prospector
      revision: release/v2.2.1
      path: modules/prospector-zmk-module
  self:
    path: config
